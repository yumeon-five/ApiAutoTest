[api_envi]
host = http://127.0.0.1:8008

# 业务前置登录账号（conftest.py 的 login_first 夹具使用）。
# 必须与 testcase/login/login.yaml 中「登录成功」用例的账号保持一致，
# 否则前置登录会失败，接口关联用的 token / operator 就写不进 extract.yaml。
[LOGIN]
username = test666
password = test123

[MYSQL]
host = 127.0.0.1
port = 3308
username = mall_user
password = MallUser_2026@Local
database = mall

# 自动化测试数据清理（common/clean_data.py，由 conftest.py 的 clean_history_data 夹具调用）。
# 创建入库单等写接口每跑一次就会造一条数据，会话开始前按 creater 前缀清理上一次的遗留数据。
[CLEAN]
# 1=开启会话前自动清理，0=关闭
enable = 1
# 测试数据标识前缀，与 testcase/asn/asn_create.yaml 里 creater: api_auto_${get_run_id()} 对应
creater_prefix = api_auto
# 物理清理（python common/clean_data.py）用的 SQLite 路径，相对 auto-test 项目根目录
sqlite_path = ../GreaterWMS/db.sqlite3

[REDIS]
host = 127.0.0.1
port = 6379
username =
password =
db = 0
# 集群模式才需要，格式 host1:port1,host2:port2,...；留空则走单机模式
startup_nodes =

[JENKINS]
url = http://192.168.105.36:8088/
username = admin
password = admin
timeout = 30
job_name = hbjjapi

