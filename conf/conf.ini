[api_envi]
host = http://127.0.0.1:8008

# 业务前置登录账号（conftest.py 的 login_first 夹具使用）。
# 必须与 testcase/login/login.yaml 中「登录成功」用例的账号保持一致，
# 否则前置登录会失败，接口关联用的 token / operator 就写不进 extract.yaml。
[LOGIN]
username = test666
password = test123

# 数据库断言（common/connection.py + assertions.py 的 db 断言）用。
# GreaterWMS 用的是 SQLite（GreaterWMS/db.sqlite3），所以 type 默认 sqlite；
# 如果被测系统换回 MySQL，把 type 改成 mysql 即可，断言写法不用动
# （两种连接的 query() 都返回 list[dict]）。
[DB]
type = sqlite
# SQLite 文件路径，相对 auto-test 项目根目录；断言以只读方式打开
sqlite_path = ../GreaterWMS/db.sqlite3

# MySQL 连接参数（[DB] type = mysql 时才用）
[MYSQL]
host = 127.0.0.1
port = 3308
username = mall_user
password = MallUser_2026@Local
database = mall

# 自动化测试数据清理（common/clean_data.py，由 conftest.py 的 clean_history_data 夹具调用）。
# 创建入库单等写接口每跑一次就会造一条数据，会话开始前按 creater 前缀清理上一次的遗留数据。
[CLEAN]
# 1=开启会话前自动清理，0=关闭
enable = 1
# 测试数据标识前缀，与 testcase/asn/asn_create.yaml 里 creater: api_auto_${get_run_id()} 对应
creater_prefix = api_auto
# 1=会话前把 Normal 库位重新标记为空库位。
# 链路的「查询库位」用例要筛 Normal 空库位，而上架成功会把该库位置为非空，
# 本环境只有 3 个 Normal 库位，不还原的话跑几次就没有空库位可用了。
# 只改 empty_label 标记位，不动库位里的实际数量；库位里有别人手工放的货时可改成 0
reset_bin_label = 1

[REDIS]
host = 127.0.0.1
port = 6379
username =
password =
db = 0
# 集群模式才需要，格式 host1:port1,host2:port2,...；留空则走单机模式
startup_nodes =

[JENKINS]
url = http://192.168.105.36:8088/
username = admin
password = admin
timeout = 30
job_name = hbjjapi

