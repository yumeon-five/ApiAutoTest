# 查询库位库存 —— 上架后核对（链路的收尾校验）
#
# 【核对什么】
#   - 该库位 + 该商品已经有库位库存记录
#   - 库位库存数量合计 = 上架数量（该库位这条商品是本次上架从无到有建出来的）
#   - 接口返回的数量与数据库 stockbin 表一致
#
# 【为什么用「合计」】每次上架源码都是 stockbin.objects.create 新增一行（不合并），
#   所以同一库位同一商品可能有多行；断言必须按商品合计，不能只看第一行。

- baseInfo:
    api_name: 查询库位库存
    url: /stock/bin/
    method: get
    header:
      Accept: application/json
      token: ${get_extract_data(token)}
      operator: ${get_extract_data(operator)}

  testCase:
    - case_name: 上架完成后核对库位库存
      params:
        goods_code: ${get_extract_data(goods_code)}
        bin_name: ${get_extract_data(bin_name)}
        page: 1
        max_page: 20
        format: json
      extract:
        bin_stock_total: $.count
      validation:
        - contains: {'status_code': 200}
        - gt: {'$.count': 0}
        # 筛出来的记录必须是这次上架的库位与商品，且属性是 Normal
        - contains: {'bin_name': '${get_extract_data(bin_name)}'}
        - contains: {'goods_code': '${get_extract_data(goods_code)}'}
        - contains: {'bin_property': 'Normal'}
        # 该库位该商品的数量合计比上架前增加 5、记录数增加 1 行（对应文档「合计比基线增加上架数量」）。
        # 基线 bin_stock_baseline 由 asn_stock_baseline.yaml（链路跑起来之前）打的，
        # 不是在本用例里打的 —— 本用例的 db_before 已经在上架之后，那时的值已经含了增量
        - db:
            sql: "select coalesce(sum(goods_qty), 0) as qty, count(*) as cnt from stockbin where openid = ? and bin_name = ? and goods_code = ?"
            params: ["${get_extract_data(token)}", "${get_extract_data(bin_name)}", "${get_extract_data(goods_code)}"]
            delta_from: bin_stock_baseline
            expect: {qty: 5, cnt: 1}
        # 接口与数据库一致性：库位库存的记录条数与库表一致
        - db:
            sql: "select (count(*) - ?) as diff from stockbin where openid = ? and bin_name = ? and goods_code = ?"
            params:
              - "${get_extract_data(bin_stock_total)}"
              - "${get_extract_data(token)}"
              - "${get_extract_data(bin_name)}"
              - "${get_extract_data(goods_code)}"
            expect: {diff: 0}
