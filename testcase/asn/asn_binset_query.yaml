# 查询库位（链路数据准备第 3 步）
#
# 【为什么需要】上架要传库位名，而且必须是本账号存在的 Normal 库位。原来写死了 A010101。
#
# 【接口行为（实测）】GET /binset/?bin_property=Normal&empty_label=true
#   返回 DRF 分页结构；上架成功后源码会把该库位的 empty_label 置为 False，
#   所以会话开始时的清理会把这些库位重新标记为空（见 conftest 的 clean_history_data）

- baseInfo:
    api_name: 查询库位
    url: /binset/
    method: get
    header:
      Accept: application/json
      token: ${get_extract_data(token)}
      operator: ${get_extract_data(operator)}

  testCase:
    - case_name: 筛选Normal类型的空库位并提取库位名称
      params:
        bin_property: Normal
        empty_label: true
        page: 1
        max_page: 20
        format: json
      extract:
        # 接口关联：取第一个空的 Normal 库位，供上架用例使用
        bin_name: $.results[0].bin_name
        bin_total: $.count
      validation:
        - contains: {'status_code': 200}
        # 必须能筛到空库位，否则上架用例没有库位可用
        - gt: {'$.count': 0}
        - contains: {'bin_property': 'Normal'}
        - contains: {'empty_label': True}
        # 接口与数据库一致性校验：接口返回的条数 = 库里 Normal + 标记为空 + 未删除的库位条数
        - db:
            sql: "select (count(*) - ?) as diff from binset where openid = ? and is_delete = 0 and bin_property = 'Normal' and empty_label = 1"
            params: ["${get_extract_data(bin_total)}", "${get_extract_data(token)}"]
            expect: {diff: 0}
