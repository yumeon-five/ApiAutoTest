# 创建入库单(ASN)主单用例，以及创建后的接口关联（用返回的 asn_code 精确回查列表）
#
# 【为什么创建和回查写在同一个文件里】
#   接口关联依赖执行顺序：先创建 -> extract 出 asn_code -> 后面的用例才能用它查询。
#   同一个文件里的用例按 yaml 顺序执行（测试模块按下标参数化），顺序是确定的；
#   如果拆成两个文件，就要依赖 pytest 按文件名排序（test_asn_create 在 test_asn_list 之前），
#   不够可靠，所以把「创建 + 回查」这一对放在一起。
#   只想跑回查用例时（比如 -k 筛选），要保证前面创建用例已经跑过一次，否则 extract.yaml 里没有 asn_code。
#
# 【接口说明】POST /asn/list/ 只要求必填 creater，asn_code / bar_code 由服务端生成：
#   asn_code = 'ASN' + yyyyMMdd + 当日序号（也可以传 ?custom_asn=xxx 指定）
#   bar_code = md5(asn_code)
#   注意：supplier 为空时记录不会出现在 GET /asn/list/ 的结果里
#   （列表的 queryset 过滤了 supplier=''），所以这里显式带上 supplier。
#
# 【断言层级】contains 里的 status_code 比较的是 HTTP 状态码；
#   eq 里写的 status_code 是响应体里的字段（本项目自定义异常处理会把 DRF 的错误码
#   放进响应体的 status_code，同时把 HTTP 状态码统一返回 200）。

# 场景一：携带 Token 创建成功
- baseInfo:
    api_name: 创建入库单主单
    url: /asn/list/
    method: post
    header:
      Content-Type: application/json
      Accept: application/json
      token: ${get_extract_data(token)}
      operator: ${get_extract_data(operator)}

  testCase:
    - case_name: 创建入库单主单成功
      params:
        format: json
      json:
        # ${get_run_id()} 由 common/debugtalk.py 提供，同一次运行内返回值固定，
        # 所以下面 validation 里可以用同样的写法断言 creater 与请求一致
        creater: api_auto_${get_run_id()}
        supplier: 哇哈哈
      validation:
        - contains: {'status_code': 200}
        # 新建记录的主键应大于 0
        - gt: {'$.id': 0}
        # 新建主单的初始状态必须是 1（待收货），且创建人/供应商与请求一致
        - eq: {'asn_status': 1, 'creater': 'api_auto_${get_run_id()}', 'supplier': '哇哈哈'}
        # asn_code / bar_code 由服务端生成，必须存在且非空
        - not_null: ['$.asn_code', '$.bar_code', '$.create_time']
        # 单号规则：以 ASN 开头（文档要求正则 ^ASN，框架暂无正则断言，用包含替代）
        - contains: {'asn_code': 'ASN'}
        # 注意：这里不能写 db 断言去核对 asn_code / bar_code。
        # validation 里的 ${} 是在「发请求之前」替换的，而 asn_code 要等这条用例的响应
        # 提取到 extract.yaml 之后才存在，写在这里会直接 KeyError。
        # 落库校验放在下面「按 asn_code 精确筛选」那条用例里（那时 asn_code / bar_code 已经有了）。
      extract:
        # 接口关联：把主键和单号写入 extract.yaml，供后面的用例用
        # ${get_extract_data(asn_id)} / ${get_extract_data(asn_code)} / ${get_extract_data(bar_code)} 引用
        asn_id: $.id
        asn_code: $.asn_code
        bar_code: $.bar_code

    - case_name: 创建失败-缺少必填字段creater
      params:
        format: json
      json:
        supplier: 哇哈哈
      validation:
        # HTTP 层仍然是 200（自定义异常处理的缺陷，正常应返回 400）
        - contains: {'status_code': 200}
        # 响应体里的业务错误码是 DRF 校验失败的 400
        - eq: {'status_code': 400}
        # 错误信息挂在 creater 字段下（形如 {"creater": ["该字段是必填项。"]}），
        # 提示语随 LANGUAGE_CODE 变化，所以只断言这个字段存在且非空，不断言具体文案
        - not_null: ['$.creater']
        # 负向落库断言：创建失败绝不能往库里写数据。
        # 本会话（creater = api_auto_<运行标识>）在「创建成功」用例里已经写了 1 条，
        # 这里断言库里仍然只有那 1 条 —— 数量没变就说明这次失败请求没有落库
        - db:
            sql: "select count(*) as cnt from asnlist where creater = ? and is_delete = 0"
            params: ["api_auto_${get_run_id()}"]
            expect: {cnt: 1}

    - case_name: 创建失败-creater包含危险字符script
      params:
        format: json
      json:
        # 服务端 utils/datasolve.py 的 data_validate 会拦截含 script / select 的输入
        creater: '<script>alert(1)</script>'
        supplier: 哇哈哈
      validation:
        - contains: {'status_code': 200}
        - eq: {'status_code': 500}
        # 原始提示语是 "Bad Data can‘not be store"（中间是个特殊单引号 U+2018），
        # 只取前缀做包含断言，避免被特殊字符和编码问题干扰
        - contains: {'detail': 'Bad Data can'}
        # 负向落库断言：危险字符被拦截后，库里不能多出记录（同样以本会话的条数为准）
        - db:
            sql: "select count(*) as cnt from asnlist where creater = ? and is_delete = 0"
            params: ["api_auto_${get_run_id()}"]
            expect: {cnt: 1}

# 场景二：接口关联 —— 用刚创建出来的 asn_code 精确回查列表
- baseInfo:
    api_name: 按asn_code查询入库单列表
    url: /asn/list/
    method: get
    header:
      Accept: application/json
      token: ${get_extract_data(token)}
      operator: ${get_extract_data(operator)}

  testCase:
    - case_name: 按asn_code精确筛选刚创建的入库单
      params:
        # 接口关联：值来自上面创建用例 extract 到 extract.yaml 的 asn_code
        asn_code: ${get_extract_data(asn_code)}
        page: 1
        max_page: 20
        format: json
      validation:
        - contains: {'status_code': 200}
        # 至少命中刚创建的那一条
        - gt: {'$.count': 0}
        # 下面几条断言的目标字段都在 results 数组里（JSONPath 用 $..key 递归查找），
        # 所以用 contains 而不是 eq（eq 只比较响应体顶层的字段）
        - contains: {'asn_code': '${get_extract_data(asn_code)}'}
        - contains: {'creater': 'api_auto_${get_run_id()}'}
        # 刚创建的主单状态应该是 1
        - contains: {'asn_status': 1}
        - contains: {'supplier': '哇哈哈'}
        # 落库交叉验证（对应文档里「asnlist 表新增记录 / scanner 表新增条码记录」两条校验点）：
        # 走到这里时 asn_code / bar_code 已经从创建用例提取到 extract.yaml，可以拿来和库里的值比对了。
        # 接口说创建成功不算数，库里真有这条数据、且 bar_code 与接口返回一致才算数
        - db:
            sql: "select asn_code, bar_code, asn_status, creater from asnlist where asn_code = ? and is_delete = 0"
            params: ["${get_extract_data(asn_code)}"]
            rows: 1
            expect:
              asn_code: "${get_extract_data(asn_code)}"
              # bar_code 是服务端按 md5(asn_code) 算的，库里的值必须和接口返回的一致
              bar_code: "${get_extract_data(bar_code)}"
              asn_status: 1
              creater: "api_auto_${get_run_id()}"
        # 创建主单时服务端会同步写一条 scanner 条码记录，也要确认落库了
        - db:
            sql: "select count(*) as cnt from scanner where mode = 'ASN' and code = ?"
            params: ["${get_extract_data(asn_code)}"]
            expect: {cnt: 1}
