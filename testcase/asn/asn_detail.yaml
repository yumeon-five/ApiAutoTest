# 添加 ASN 商品明细用例（POST /asn/detail/）
#
# 【前置依赖】需要一条 asn_status=1 的 ASN 主单，asn_code 来自 test_asn_create.py 的提取。
#   所以本模块要在 test_asn_create.py 之后执行（pytest 按文件名排序：create 在 detail 之前）。
#   只单独跑本文件会取不到 asn_code，这时报错会提示先跑 test_asn_create.py。
#
# 【接口行为（读源码 + 实测确认）】
#   - 请求体要三个必填参数：asn_code、supplier（供应商名称，必须在该账号的 supplier 表里存在）、
#     goods_code / goods_qty（两个数组，一一对应）
#   - 明细记录的 creater 不是取请求体，而是取请求头 operator 对应的员工姓名
#     （asn/views.py: staff.objects.filter(id=HTTP_OPERATOR).first().staff_name），
#     所以下面用 db 断言交叉验证 creater 与登录账号一致，等于验证了 operator 头生效
#   - 成功响应是 {"detail": "success"}；失败走自定义异常处理：HTTP 200 + 响应体 status_code 500
#   - 副作用：会累加 stocklist 的 goods_qty 与 asn_stock，并把主单的 supplier/total_* 回填
#
# 【为什么用 db_before + delta_from（增量断言）】
#   库存字段是「累积型」的：同一套用例跑第二遍，goods_qty 就不是上次那个值了，写死绝对值必然失败。
#   所以先在发请求前用 db_before 打一个基线快照，断言时用 delta_from 引用它，
#   此时 expect 里的值表示「相对基线的变化量」。失败用例则断言变化量为 0（= 没有写库）。

# 场景一：状态为 1 的 ASN 添加明细成功，并校验落库与库存增量
- baseInfo:
    api_name: 添加ASN商品明细
    url: /asn/detail/
    method: post
    header:
      Content-Type: application/json
      Accept: application/json
      token: ${get_extract_data(token)}
      operator: ${get_extract_data(operator)}

  testCase:
    - case_name: 添加商品明细成功
      params:
        format: json
      # 发请求前先记录库存基线（同一个商品在库里可能有多行库存记录，
      # 这里按 id 取第一行 —— 与接口 update 时用的 stocklist.objects.filter(...).first() 保持一致）
      db_before:
        stock_snapshot:
          sql: "select goods_qty, asn_stock, onhand_stock, can_order_stock from stocklist where openid = ? and goods_code = ? order by id limit 1"
          params: ["${get_extract_data(token)}", "${get_extract_data(goods_code)}"]
      json:
        # A00001 / Supplier Name-1 是示例，实际值由链路前面的查询用例提取（供应商见 supplier 表，商品见 goods 表）
        asn_code: ${get_extract_data(asn_code)}
        supplier: ${get_extract_data(supplier_name)}
        goods_code: ["${get_extract_data(goods_code)}"]
        goods_qty: [5]
      validation:
        - contains: {'status_code': 200}
        - eq: {'detail': 'success'}
        # 明细落库：goods_qty / asn_status / supplier 都要对，creater 必须是 operator 对应的员工名
        - db:
            sql: "select goods_code, goods_qty, asn_status, supplier, creater from asndetail where asn_code = ? and is_delete = 0"
            params: ["${get_extract_data(asn_code)}"]
            rows: 1
            expect:
              goods_code: ${get_extract_data(goods_code)}
              goods_qty: 5
              asn_status: 1
              supplier: ${get_extract_data(supplier_name)}
              # operator 头 = 81（test666 的 staff id），明细的 creater 应该是它对应的员工姓名
              creater: "${get_extract_data(user_name)}"
        # 主单被回填：供应商 + 重量/体积/金额合计。
        # 合计值不写死数字（写死就等于把某个商品的重量体积成本塞进用例，换个商品/换个环境就失效），
        # 改成断言「主单合计 == 明细金额」这个恒等关系 —— 单商品明细场景下两者必须相等
        - db:
            sql: "select (a.total_weight - d.goods_weight) as w, (a.total_volume - d.goods_volume) as v, (a.total_cost - d.goods_cost) as c from asnlist a, asndetail d where a.asn_code = d.asn_code and a.asn_code = ? and a.is_delete = 0 and d.is_delete = 0"
            params: ["${get_extract_data(asn_code)}"]
            expect: {w: 0, v: 0, c: 0}
        # 主单的供应商被回填成请求里的供应商
        - db:
            sql: "select supplier from asnlist where asn_code = ? and is_delete = 0"
            params: ["${get_extract_data(asn_code)}"]
            expect:
              supplier: ${get_extract_data(supplier_name)}
        # 库存增量：goods_qty、asn_stock 各 +5；到货库存与可用库存不受影响（增量为 0）
        - db:
            sql: "select goods_qty, asn_stock, onhand_stock, can_order_stock from stocklist where openid = ? and goods_code = ? order by id limit 1"
            params: ["${get_extract_data(token)}", "${get_extract_data(goods_code)}"]
            delta_from: stock_snapshot
            expect: {goods_qty: 5, asn_stock: 5, onhand_stock: 0, can_order_stock: 0}

# 场景二：异常场景（ASN 不存在 / 供应商不存在 / 数量边界 / 数量为负）
- baseInfo:
    api_name: 添加ASN商品明细-异常场景
    url: /asn/detail/
    method: post
    header:
      Content-Type: application/json
      Accept: application/json
      token: ${get_extract_data(token)}
      operator: ${get_extract_data(operator)}

  testCase:
    - case_name: 添加失败-ASN编号不存在
      params:
        format: json
      db_before:
        # 这个不存在的单号在本用例执行前就应该没有明细，基线为空
        detail_snapshot:
          sql: "select count(*) as cnt from asndetail where asn_code = ? and is_delete = 0"
          params: ["ASN_NOT_EXISTS_${get_run_id()}"]
      json:
        asn_code: ASN_NOT_EXISTS_${get_run_id()}
        supplier: ${get_extract_data(supplier_name)}
        goods_code: ["${get_extract_data(goods_code)}"]
        goods_qty: [5]
      validation:
        - contains: {'status_code': 200}
        - eq: {'status_code': 500}
        - contains: {'detail': 'ASN Code does not exists'}
        # 负向落库断言：不存在的 ASN 不能写入任何明细（增量 0）
        - db:
            sql: "select count(*) as cnt from asndetail where asn_code = ? and is_delete = 0"
            params: ["ASN_NOT_EXISTS_${get_run_id()}"]
            delta_from: detail_snapshot
            expect: {cnt: 0}

    - case_name: 添加失败-供应商不存在
      params:
        format: json
      db_before:
        detail_snapshot:
          sql: "select count(*) as cnt from asndetail where asn_code = ? and is_delete = 0"
          params: ["${get_extract_data(asn_code)}"]
        stock_snapshot:
          sql: "select goods_qty, asn_stock from stocklist where openid = ? and goods_code = ? order by id limit 1"
          params: ["${get_extract_data(token)}", "${get_extract_data(goods_code)}"]
      json:
        asn_code: ${get_extract_data(asn_code)}
        supplier: SUPPLIER_NOT_EXISTS_${get_run_id()}
        goods_code: ["${get_extract_data(goods_code)}"]
        goods_qty: [5]
      validation:
        - contains: {'status_code': 200}
        - eq: {'status_code': 500}
        - contains: {'detail': 'Supplier does not exists'}
        # 明细数没变化
        - db:
            sql: "select count(*) as cnt from asndetail where asn_code = ? and is_delete = 0"
            params: ["${get_extract_data(asn_code)}"]
            delta_from: detail_snapshot
            expect: {cnt: 0}
        # 库存也没变化（对应文档「stocklist 表对应商品库存不发生变化」）
        - db:
            sql: "select goods_qty, asn_stock from stocklist where openid = ? and goods_code = ? order by id limit 1"
            params: ["${get_extract_data(token)}", "${get_extract_data(goods_code)}"]
            delta_from: stock_snapshot
            expect: {goods_qty: 0, asn_stock: 0}

    - case_name: 添加失败-计划数量等于0
      params:
        format: json
      db_before:
        detail_snapshot:
          sql: "select count(*) as cnt from asndetail where asn_code = ? and is_delete = 0"
          params: ["${get_extract_data(asn_code)}"]
      json:
        asn_code: ${get_extract_data(asn_code)}
        supplier: ${get_extract_data(supplier_name)}
        goods_code: ["${get_extract_data(goods_code)}"]
        goods_qty: [0]
      validation:
        - contains: {'status_code': 200}
        - eq: {'status_code': 500}
        - contains: {'detail': 'Qty Must > 0'}
        # 数量为 0 时不允许落库
        - db:
            sql: "select count(*) as cnt from asndetail where asn_code = ? and is_delete = 0"
            params: ["${get_extract_data(asn_code)}"]
            delta_from: detail_snapshot
            expect: {cnt: 0}

    - case_name: 添加失败-计划数量为负数
      params:
        format: json
      db_before:
        detail_snapshot:
          sql: "select count(*) as cnt from asndetail where asn_code = ? and is_delete = 0"
          params: ["${get_extract_data(asn_code)}"]
        stock_snapshot:
          sql: "select goods_qty, asn_stock from stocklist where openid = ? and goods_code = ? order by id limit 1"
          params: ["${get_extract_data(token)}", "${get_extract_data(goods_code)}"]
      json:
        asn_code: ${get_extract_data(asn_code)}
        supplier: ${get_extract_data(supplier_name)}
        goods_code: ["${get_extract_data(goods_code)}"]
        goods_qty: [-1]
      validation:
        - contains: {'status_code': 200}
        - eq: {'status_code': 500}
        - contains: {'detail': 'Qty Must > 0'}
        - db:
            sql: "select count(*) as cnt from asndetail where asn_code = ? and is_delete = 0"
            params: ["${get_extract_data(asn_code)}"]
            delta_from: detail_snapshot
            expect: {cnt: 0}
        # 对应文档「库存不得出现负数」：数量和 ASN 在途量都不能因这次失败而变化，自然也不会变负
        - db:
            sql: "select goods_qty, asn_stock from stocklist where openid = ? and goods_code = ? order by id limit 1"
            params: ["${get_extract_data(token)}", "${get_extract_data(goods_code)}"]
            delta_from: stock_snapshot
            expect: {goods_qty: 0, asn_stock: 0}
