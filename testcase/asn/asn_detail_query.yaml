# 按 ASN 编号查询商品明细
#
# 【业务位置】链路第 6 步：完成分拣(3->4) -> 【查明细取 detail_id】 -> 上架(4->5)
#   上架接口的路径参数是「明细主键」（/asn/movetobin/{detail_id}/），
#   而添加明细的响应只有 {"detail": "success"} 拿不到 id，
#   所以链路里需要这一步查询，把 detail_id 提取到 extract.yaml 供上架用例关联。
#
# 【接口行为（实测）】GET /asn/detail/?asn_code=xxx
#   返回 DRF 分页结构 {count, next, previous, results:[{id, asn_code, supplier, goods_code,
#   goods_qty, goods_actual_qty, sorted_qty, ...}]}

- baseInfo:
    api_name: 按ASN编号查询商品明细
    url: /asn/detail/
    method: get
    header:
      Accept: application/json
      token: ${get_extract_data(token)}
      operator: ${get_extract_data(operator)}

  testCase:
    - case_name: 按ASN编号查询明细并提取明细ID
      params:
        asn_code: ${get_extract_data(asn_code)}
        page: 1
        max_page: 20
        format: json
      validation:
        - contains: {'status_code': 200}
        - gt: {'$.count': 0}
        # 明细字段：商品编码、计划数量、实到数量都应该和前面链路一致
        - contains: {'goods_code': 'A00001'}
        - contains: {'goods_qty': 5}
        - contains: {'goods_actual_qty': 5}
        - contains: {'asn_status': 4}
      extract:
        # 接口关联：明细主键，上架接口的路径参数要用
        detail_id: $.results[0].id

    - case_name: 查询不存在的ASN编号返回空列表
      params:
        asn_code: ASN_NOT_EXISTS_${get_run_id()}
        page: 1
        max_page: 20
        format: json
      validation:
        - contains: {'status_code': 200}
        # 不存在的单号应该返回 0 条，而不是别人的数据
        - eq: {'count': 0}
        - db:
            sql: "select count(*) as cnt from asndetail where asn_code = ? and is_delete = 0"
            params: ["ASN_NOT_EXISTS_${get_run_id()}"]
            expect: {cnt: 0}
