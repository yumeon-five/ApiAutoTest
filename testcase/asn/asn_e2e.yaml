# ASN 单商品完整入库链路 E2E（一条用例串完整条链路）
#
# 【与分步链路模块的区别】
#   分步链路：test_asn_supplier_query / create / detail / preload / ... 各自是按接口拆的用例，
#             靠 CHAIN_ORDER 串起来跑，失败能精确定位到某一步（回归用）。
#   本文件：把整条链路压成「一条用例」，自带登录、不依赖其他模块的执行顺序（冒烟用），
#           Allure 报告里只统计 1 条 —— 这是用例文档 ASN单商品完整入库链路E2E 的要求。
#
# 【链路】登录 -> 查供应商 -> 查商品 -> 查空库位 -> 取库存基线 -> 创建主单(1) -> 添加明细(1)
#         -> 预装车(2) -> 预分拣(3) -> 完成分拣(4) -> 查明细取 detail_id -> 上架(5)
#         -> 按ID查主单 -> 核对总库存增量 -> 核对库位库存增量
#
# 【数量约定】本用例固定：计划数量 = 实到数量 = 上架数量 = 5。
#   这是测试输入（不是环境数据），所以断言里的 +5 是确定的。

# 第 1 步：登录（E2E 自带登录，不依赖 test_login 模块）
- baseInfo:
    api_name: 登录
    url: /login/
    method: post
    header:
      Content-Type: application/json;charset=UTF-8
      Accept: application/json
  testCase:
    - case_name: 登录获取链路凭据
      json:
        name: test666
        password: test123
      extract:
        token: $.data.openid
        operator: $.data.user_id
        user_name: $.data.name
      validation:
        - contains: {'status_code': 200}
        - contains: {'code': '200'}
        - not_null: ['$.data.openid', '$.data.user_id']

# 第 2 步：查询可用供应商
- baseInfo:
    api_name: 查询可用供应商
    url: /supplier/
    method: get
    header:
      Accept: application/json
      token: ${get_extract_data(token)}
  testCase:
    - case_name: 查询可用供应商
      params: {page: 1, max_page: 20, format: json}
      extract:
        supplier_name: $.results[0].supplier_name
      validation:
        - contains: {'status_code': 200}
        - gt: {'$.count': 0}

# 第 3 步：查询可用商品
- baseInfo:
    api_name: 查询可用商品
    url: /goods/
    method: get
    header:
      Accept: application/json
      token: ${get_extract_data(token)}
  testCase:
    - case_name: 查询可用商品
      params: {page: 1, max_page: 20, format: json}
      extract:
        goods_code: $.results[0].goods_code
      validation:
        - contains: {'status_code': 200}
        - gt: {'$.count': 0}

# 第 4 步：查询 Normal 空库位
- baseInfo:
    api_name: 查询库位
    url: /binset/
    method: get
    header:
      Accept: application/json
      token: ${get_extract_data(token)}
  testCase:
    - case_name: 查询Normal空库位
      params: {bin_property: Normal, empty_label: true, page: 1, max_page: 20, format: json}
      extract:
        bin_name: $.results[0].bin_name
      validation:
        - contains: {'status_code': 200}
        - gt: {'$.count': 0}
        - contains: {'empty_label': True}

# 第 5 步：取库存基线（总库存 + 库位库存）
# 基线名加 e2e_ 前缀，和分步链路模块的基线区分开，避免互相覆盖后排查困难
- baseInfo:
    api_name: 查询商品总库存-基线
    url: /stock/list/
    method: get
    header:
      Accept: application/json
      token: ${get_extract_data(token)}
  testCase:
    - case_name: 取入库前库存基线
      params: {goods_code: "${get_extract_data(goods_code)}", page: 1, max_page: 20, format: json}
      db_before:
        e2e_stock_baseline:
          sql: "select goods_qty, onhand_stock, can_order_stock, asn_stock, pre_load_stock, pre_sort_stock, sorted_stock from stocklist where openid = ? and goods_code = ? order by id limit 1"
          params: ["${get_extract_data(token)}", "${get_extract_data(goods_code)}"]
        e2e_bin_baseline:
          sql: "select coalesce(sum(goods_qty), 0) as qty, count(*) as cnt from stockbin where openid = ? and bin_name = ? and goods_code = ?"
          params: ["${get_extract_data(token)}", "${get_extract_data(bin_name)}", "${get_extract_data(goods_code)}"]
      validation:
        - contains: {'status_code': 200}
        - not_null: ['$.results']

# 第 6 步：创建 ASN 主单（状态 1）
- baseInfo:
    api_name: 创建ASN主单
    url: /asn/list/
    method: post
    header:
      Content-Type: application/json
      Accept: application/json
      token: ${get_extract_data(token)}
      operator: ${get_extract_data(operator)}
  testCase:
    - case_name: 创建主单并进入状态1
      params: {format: json}
      json:
        creater: api_auto_${get_run_id()}
        supplier: ${get_extract_data(supplier_name)}
      extract:
        asn_id: $.id
        asn_code: $.asn_code
        bar_code: $.bar_code
      validation:
        - contains: {'status_code': 200}
        - eq: {'asn_status': 1}
        - not_null: ['$.asn_code', '$.bar_code']
        - db:
            sql: "select asn_status from asnlist where asn_code = ? and is_delete = 0"
            params: ["${get_extract_data(asn_code)}"]
            expect: {asn_status: 1}

# 第 7 步：添加商品明细（明细状态 1）
- baseInfo:
    api_name: 添加ASN商品明细
    url: /asn/detail/
    method: post
    header:
      Content-Type: application/json
      Accept: application/json
      token: ${get_extract_data(token)}
      operator: ${get_extract_data(operator)}
  testCase:
    - case_name: 添加商品明细
      params: {format: json}
      json:
        asn_code: ${get_extract_data(asn_code)}
        supplier: ${get_extract_data(supplier_name)}
        goods_code: ["${get_extract_data(goods_code)}"]
        goods_qty: [5]
      validation:
        - contains: {'status_code': 200}
        - eq: {'detail': 'success'}
        # 明细落库：状态 1、计划数量 5，creater 是 operator 头对应的员工（= 登录名）
        - db:
            sql: "select asn_status, goods_qty, supplier, creater from asndetail where asn_code = ? and is_delete = 0"
            params: ["${get_extract_data(asn_code)}"]
            rows: 1
            expect:
              asn_status: 1
              goods_qty: 5
              supplier: ${get_extract_data(supplier_name)}
              creater: ${get_extract_data(user_name)}

# 第 8 步：预装车（主单与明细 1 -> 2）
- baseInfo:
    api_name: ASN预装车
    url: /asn/preload/${get_extract_data(asn_id)}/
    method: post
    header:
      Content-Type: application/json
      Accept: application/json
      token: ${get_extract_data(token)}
      operator: ${get_extract_data(operator)}
  testCase:
    - case_name: 预装车进入状态2
      params: {format: json}
      validation:
        - contains: {'status_code': 200}
        - eq: {'asn_status': 2}
        - db:
            sql: "select asn_status from asnlist where asn_code = ? and is_delete = 0"
            params: ["${get_extract_data(asn_code)}"]
            expect: {asn_status: 2}
        - db:
            sql: "select asn_status from asndetail where asn_code = ? and is_delete = 0"
            params: ["${get_extract_data(asn_code)}"]
            expect: {asn_status: 2}

# 第 9 步：预分拣（2 -> 3）
- baseInfo:
    api_name: ASN预分拣
    url: /asn/presort/${get_extract_data(asn_id)}/
    method: post
    header:
      Content-Type: application/json
      Accept: application/json
      token: ${get_extract_data(token)}
      operator: ${get_extract_data(operator)}
  testCase:
    - case_name: 预分拣进入状态3
      params: {format: json}
      validation:
        - contains: {'status_code': 200}
        - eq: {'asn_status': 3}
        - db:
            sql: "select asn_status from asnlist where asn_code = ? and is_delete = 0"
            params: ["${get_extract_data(asn_code)}"]
            expect: {asn_status: 3}
        - db:
            sql: "select asn_status from asndetail where asn_code = ? and is_delete = 0"
            params: ["${get_extract_data(asn_code)}"]
            expect: {asn_status: 3}

# 第 10 步：完成分拣（3 -> 4，实到 = 计划 = 5）
- baseInfo:
    api_name: ASN完成分拣
    url: /asn/sorted/${get_extract_data(asn_id)}/
    method: post
    header:
      Content-Type: application/json
      Accept: application/json
      token: ${get_extract_data(token)}
      operator: ${get_extract_data(operator)}
  testCase:
    - case_name: 完成分拣进入状态4
      params: {format: json}
      json:
        asn_code: ${get_extract_data(asn_code)}
        supplier: ${get_extract_data(supplier_name)}
        goodsData: [{"goods_code": "${get_extract_data(goods_code)}", "goods_actual_qty": 5}]
      validation:
        - contains: {'status_code': 200}
        - eq: {'detail': 'success'}
        - db:
            sql: "select asn_status from asnlist where asn_code = ? and is_delete = 0"
            params: ["${get_extract_data(asn_code)}"]
            expect: {asn_status: 4}
        - db:
            sql: "select asn_status, goods_actual_qty, goods_shortage_qty, goods_more_qty from asndetail where asn_code = ? and is_delete = 0"
            params: ["${get_extract_data(asn_code)}"]
            expect: {asn_status: 4, goods_actual_qty: 5, goods_shortage_qty: 0, goods_more_qty: 0}

# 第 11 步：查询明细取 detail_id（上架接口的路径参数是明细主键）
- baseInfo:
    api_name: 按ASN编号查询商品明细
    url: /asn/detail/
    method: get
    header:
      Accept: application/json
      token: ${get_extract_data(token)}
  testCase:
    - case_name: 查询明细并提取明细ID
      params: {asn_code: "${get_extract_data(asn_code)}", page: 1, max_page: 20, format: json}
      extract:
        detail_id: $.results[0].id
      validation:
        - contains: {'status_code': 200}
        - eq: {'count': 1}
        - contains: {'asn_status': 4}

# 第 12 步：商品上架（4 -> 5）
- baseInfo:
    api_name: ASN商品上架
    url: /asn/movetobin/${get_extract_data(detail_id)}/
    method: post
    header:
      Content-Type: application/json
      Accept: application/json
      token: ${get_extract_data(token)}
      operator: ${get_extract_data(operator)}
  testCase:
    - case_name: 全量上架进入状态5
      params: {format: json}
      json:
        asn_code: ${get_extract_data(asn_code)}
        goods_code: ${get_extract_data(goods_code)}
        bin_name: ${get_extract_data(bin_name)}
        qty: 5
      validation:
        - contains: {'status_code': 200}
        - eq: {'detail': 'success'}
        # 明细：状态 5、已上架数量 = 5
        - db:
            sql: "select asn_status, sorted_qty, goods_actual_qty from asndetail where asn_code = ? and is_delete = 0"
            params: ["${get_extract_data(asn_code)}"]
            expect: {asn_status: 5, sorted_qty: 5, goods_actual_qty: 5}
        # 主单：整单入库完成，状态 5
        - db:
            sql: "select asn_status from asnlist where asn_code = ? and is_delete = 0"
            params: ["${get_extract_data(asn_code)}"]
            expect: {asn_status: 5}

# 第 13 步：按 ID 查主单，确认接口自洽（创建时返回的单号/条码，查回来还是同一个）
- baseInfo:
    api_name: 按ID查询ASN主单
    url: /asn/list/${get_extract_data(asn_id)}/
    method: get
    header:
      Accept: application/json
      token: ${get_extract_data(token)}
  testCase:
    - case_name: 按ID查主单确认链路终态
      params: {format: json}
      validation:
        - contains: {'status_code': 200}
        - eq: {'asn_status': 5, 'asn_code': '${get_extract_data(asn_code)}'}
        - contains: {'bar_code': '${get_extract_data(bar_code)}'}

# 第 14 步：核对总库存增量（链路级不变量）
- baseInfo:
    api_name: 查询商品总库存-终态核对
    url: /stock/list/
    method: get
    header:
      Accept: application/json
      token: ${get_extract_data(token)}
  testCase:
    - case_name: 核对总库存终态与中间态
      params: {goods_code: "${get_extract_data(goods_code)}", page: 1, max_page: 20, format: json}
      extract:
        e2e_final_goods_qty: $.results[0].goods_qty
        e2e_final_onhand: $.results[0].onhand_stock
        e2e_final_can_order: $.results[0].can_order_stock
      validation:
        - contains: {'status_code': 200}
        - eq: {'count': 1}
        # 终态：商品总量 / 到货量 / 可用量都比入库前净增 5
        - db:
            sql: "select goods_qty, onhand_stock, can_order_stock from stocklist where openid = ? and goods_code = ? order by id limit 1"
            params: ["${get_extract_data(token)}", "${get_extract_data(goods_code)}"]
            delta_from: e2e_stock_baseline
            expect: {goods_qty: 5, onhand_stock: 5, can_order_stock: 5}
        # 中间态：四个流转字段全部回到基线（这是单步用例查不出来的跨步骤问题）
        - db:
            sql: "select asn_stock, pre_load_stock, pre_sort_stock, sorted_stock from stocklist where openid = ? and goods_code = ? order by id limit 1"
            params: ["${get_extract_data(token)}", "${get_extract_data(goods_code)}"]
            delta_from: e2e_stock_baseline
            expect: {asn_stock: 0, pre_load_stock: 0, pre_sort_stock: 0, sorted_stock: 0}
        # 接口返回值与库内记录一致（把接口返回的三个值当 SQL 参数，差值应为 0）
        - db:
            sql: "select (goods_qty - ?) as g, (onhand_stock - ?) as o, (can_order_stock - ?) as c from stocklist where openid = ? and goods_code = ? order by id limit 1"
            params:
              - "${get_extract_data(e2e_final_goods_qty)}"
              - "${get_extract_data(e2e_final_onhand)}"
              - "${get_extract_data(e2e_final_can_order)}"
              - "${get_extract_data(token)}"
              - "${get_extract_data(goods_code)}"
            expect: {g: 0, o: 0, c: 0}
        # 主单合计 = 明细金额（不写死重量/体积/金额，换商品也不会失效）
        - db:
            sql: "select (a.total_weight - d.goods_weight) as w, (a.total_volume - d.goods_volume) as v, (a.total_cost - d.goods_cost) as c from asnlist a, asndetail d where a.asn_code = d.asn_code and a.asn_code = ? and a.is_delete = 0 and d.is_delete = 0"
            params: ["${get_extract_data(asn_code)}"]
            expect: {w: 0, v: 0, c: 0}

# 第 15 步：核对库位库存增量
- baseInfo:
    api_name: 查询库位库存
    url: /stock/bin/
    method: get
    header:
      Accept: application/json
      token: ${get_extract_data(token)}
  testCase:
    - case_name: 核对库位库存增量
      params:
        goods_code: ${get_extract_data(goods_code)}
        bin_name: ${get_extract_data(bin_name)}
        page: 1
        max_page: 20
        format: json
      validation:
        - contains: {'status_code': 200}
        - gt: {'$.count': 0}
        - contains: {'bin_name': '${get_extract_data(bin_name)}'}
        - contains: {'goods_code': '${get_extract_data(goods_code)}'}
        - contains: {'bin_property': 'Normal'}
        # 该库位该商品的数量合计比入库前净增 5、记录数增加 1 行
        - db:
            sql: "select coalesce(sum(goods_qty), 0) as qty, count(*) as cnt from stockbin where openid = ? and bin_name = ? and goods_code = ?"
            params: ["${get_extract_data(token)}", "${get_extract_data(bin_name)}", "${get_extract_data(goods_code)}"]
            delta_from: e2e_bin_baseline
            expect: {qty: 5, cnt: 1}
