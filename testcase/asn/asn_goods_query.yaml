# 查询可用商品（链路数据准备第 2 步）
#
# 【为什么需要】添加明细要传商品编码。原来用例里写死了 A00001，环境一变就得改用例；
#   换成查出来再关联，环境换了也不用改用例。
#
# 【接口行为（实测）】GET /goods/  返回 DRF 分页结构，results[0] 含 goods_code / goods_desc /
#   goods_weight / unit_volume / goods_cost 等字段（后面断言主单合计时要用到这些值）

- baseInfo:
    api_name: 查询可用商品
    url: /goods/
    method: get
    header:
      Accept: application/json
      token: ${get_extract_data(token)}
      operator: ${get_extract_data(operator)}

  testCase:
    - case_name: 查询可用商品成功并提取商品编码
      params:
        page: 1
        max_page: 20
        format: json
      extract:
        # 接口关联：取第一个可用商品，供添加明细 / 库存查询 / 上架使用
        goods_code: $.results[0].goods_code
        goods_weight: $.results[0].goods_weight
        goods_unit_volume: $.results[0].unit_volume
        goods_cost: $.results[0].goods_cost
        goods_total: $.count
      validation:
        - contains: {'status_code': 200}
        - gt: {'$.count': 0}
        - not_null: ['$.results']
        # 接口与数据库一致性校验：接口条数 = 库里该账号未删除的商品条数
        - db:
            sql: "select (count(*) - ?) as diff from goods where openid = ? and is_delete = 0"
            params: ["${get_extract_data(goods_total)}", "${get_extract_data(token)}"]
            expect: {diff: 0}
        # 提取出来的商品编码在库里必须真实存在（防止接口返回和库不一致）
        - db:
            sql: "select count(*) as cnt from goods where openid = ? and goods_code = ? and is_delete = 0"
            params: ["${get_extract_data(token)}", "${get_extract_data(goods_code)}"]
            expect: {cnt: 1}
