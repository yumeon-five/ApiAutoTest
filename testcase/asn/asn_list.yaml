# 入库单（ASN）列表查询用例
#
# 【文件结构】同一个接口的两组请求头（带 token / 不带 token）写在两个顶层 baseInfo 块里，
#   get_testcase_yaml() 会按块展开成 [baseInfo, testCase] 列表，测试模块里按下标参数化即可
#   （单个 baseInfo 的文件同样适用，两种写法行为一致）。
#
# 【请求头】GreaterWMS 的 DRF 接口鉴权读的是 HTTP_TOKEN（值 = 登录返回的 data.openid）；
#   写操作类接口还会读 HTTP_OPERATOR（值 = 登录返回的 data.user_id，即 staff 表主键）。
#   这两个值由 conftest.py 的 login_first 夹具在会话开始时写入 extract.yaml，
#   yaml 里用 ${get_extract_data(token)} 这种写法取值（见 base/apiutil.py 的 replace_load）。
#
# 【断言关键字】contains / eq / ne / rv / db / not_null / not_exists / gt，
#   实现见 common/assertions.py；写了不支持的关键字会直接判定用例失败（不会静默通过）。

# 场景一：携带 Token 查询成功
- baseInfo:
    api_name: 查询入库单列表
    url: /asn/list/
    method: get
    header:
      Accept: application/json
      token: ${get_extract_data(token)}
      operator: ${get_extract_data(operator)}

  testCase:
    - case_name: 查询入库单列表成功
      params:
        page: 1
        max_page: 20
        format: json
      validation:
        # HTTP 层：接口正常返回 200
        - contains: {'status_code': 200}
        # 响应结构层：DRF 分页固定返回 count / next / previous / results，
        # 这个接口额外带了 supplier_list（供应商下拉数据）
        # 注意 not_null 只要求「字段存在且非空」，count=0 也算通过 —— 所以这条用例不依赖库里有几条数据
        - not_null: ['$.count', '$.results', '$.supplier_list']
        # 如果想断言「确实查到了数据」，用下面这条（当前库里 test666 有 1 条 ASN202609191，count=1）：
        # 空库上跑会失败，所以更强的断言（count>=1、asn_code 命中、creater 一致）
        # 留到「创建 ASN -> 查询列表」的链路用例里写，见 接口测试用例/查询ASN主单列表接口_测试用例.md
        # - gt: {'$.count': 0}

# 场景二：未携带 Token 查询失败
- baseInfo:
    api_name: 查询入库单列表-未携带Token
    url: /asn/list/
    method: get
    header:
      Accept: application/json

  testCase:
    - case_name: 未携带Token访问失败
      params:
        page: 1
        max_page: 20
        format: json
      validation:
        # 实测：鉴权失败时 HTTP 状态码仍然是 200，业务错误码被放在响应体的 status_code 字段里
        # （自定义异常处理把 DRF 的 APIException 包成了 200 + {"detail":..., "status_code":500}）
        # 这属于当前实现的缺陷（正常应返回 HTTP 401/403），用例先把这个现状固化下来；
        # 开发修复后把这行改成 contains: {'status_code': 401} 即可
        - contains: {'status_code': 200}
        # 响应体断言：eq 支持多字段，只比较写出来的字段（不会因为响应里还有别的字段而失败）
        - eq: {'detail': 'Please Add Token To Your Request Headers', 'status_code': 500}
        # 负向断言：鉴权失败不得返回任何 ASN 业务数据
        - not_exists: ['$.results', '$.count']
