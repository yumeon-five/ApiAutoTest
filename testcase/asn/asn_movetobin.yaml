# ASN 商品上架（状态 4 -> 5，入库链路最后一步）
#
# 【业务位置】链路第 7 步：完成分拣(3->4) -> 查明细取 detail_id -> 【上架(4->5)】
# 【前置依赖】test_asn_sorted.py（状态推到 4）+ test_asn_detail_query.py（提取 detail_id）
#
# 【接口行为（读源码 + 实测）】
#   POST /asn/movetobin/{detail_id}/   ← 路径参数是「明细主键」，不是主单主键
#     （源码 MoveToBinViewSet.get_queryset 查的是 AsnDetailModel，校验的 qs.asn_status 是明细状态）
#   请求体：asn_code、goods_code、bin_name（库位名，必须是本账号的库位）、qty
#   分支逻辑：move_qty = 明细实到数量 - 已上架数量 - 本次数量
#     move_qty > 0  -> 部分上架，明细仍是 4
#     move_qty == 0 -> 全量上架：明细 4->5；主单在最后一条明细上架后 4->5
#     move_qty < 0  -> 报 "Move Qty must < Actual Arrive Qty"
#   副作用（Normal 库位）：stocklist sorted_stock -= qty、onhand_stock += qty、can_order_stock += qty；
#                        另外写 stockbin（库位库存）和数量变更记录

- baseInfo:
    api_name: ASN商品上架
    url: /asn/movetobin/${get_extract_data(detail_id)}/
    method: post
    header:
      Content-Type: application/json
      Accept: application/json
      token: ${get_extract_data(token)}
      operator: ${get_extract_data(operator)}

  testCase:
    - case_name: 上架失败-上架数量等于0
      params:
        format: json
      db_before:
        detail_snapshot:
          sql: "select sorted_qty from asndetail where asn_code = ? and is_delete = 0"
          params: ["${get_extract_data(asn_code)}"]
        stock_snapshot:
          sql: "select sorted_stock, onhand_stock, can_order_stock from stocklist where openid = ? and goods_code = ? order by id limit 1"
          params: ["${get_extract_data(token)}", "${get_extract_data(goods_code)}"]
      json:
        asn_code: ${get_extract_data(asn_code)}
        goods_code: ${get_extract_data(goods_code)}
        bin_name: ${get_extract_data(bin_name)}
        qty: 0
      validation:
        - contains: {'status_code': 200}
        - eq: {'status_code': 500}
        - contains: {'detail': 'Move QTY Must > 0'}
        # 数量为 0 时明细与库存都不能动
        - db:
            sql: "select sorted_qty from asndetail where asn_code = ? and is_delete = 0"
            params: ["${get_extract_data(asn_code)}"]
            delta_from: detail_snapshot
            expect: {sorted_qty: 0}
        - db:
            sql: "select sorted_stock, onhand_stock, can_order_stock from stocklist where openid = ? and goods_code = ? order by id limit 1"
            params: ["${get_extract_data(token)}", "${get_extract_data(goods_code)}"]
            delta_from: stock_snapshot
            expect: {sorted_stock: 0, onhand_stock: 0, can_order_stock: 0}

    - case_name: 上架失败-上架数量超过实到数量
      params:
        format: json
      db_before:
        detail_snapshot:
          sql: "select sorted_qty from asndetail where asn_code = ? and is_delete = 0"
          params: ["${get_extract_data(asn_code)}"]
        stock_snapshot:
          sql: "select sorted_stock, onhand_stock, can_order_stock from stocklist where openid = ? and goods_code = ? order by id limit 1"
          params: ["${get_extract_data(token)}", "${get_extract_data(goods_code)}"]
      json:
        asn_code: ${get_extract_data(asn_code)}
        goods_code: ${get_extract_data(goods_code)}
        bin_name: ${get_extract_data(bin_name)}
        # 实到 5，这里传 6 -> move_qty = 5 - 0 - 6 = -1
        qty: 6
      validation:
        - contains: {'status_code': 200}
        - eq: {'status_code': 500}
        - contains: {'detail': 'Move Qty must < Actual Arrive Qty'}
        # 主单和明细都还停在 4
        - db:
            sql: "select asn_status from asnlist where asn_code = ? and is_delete = 0"
            params: ["${get_extract_data(asn_code)}"]
            expect: {asn_status: 4}
        - db:
            sql: "select asn_status, sorted_qty from asndetail where asn_code = ? and is_delete = 0"
            params: ["${get_extract_data(asn_code)}"]
            expect: {asn_status: 4}
        - db:
            sql: "select sorted_qty from asndetail where asn_code = ? and is_delete = 0"
            params: ["${get_extract_data(asn_code)}"]
            delta_from: detail_snapshot
            expect: {sorted_qty: 0}
        - db:
            sql: "select sorted_stock, onhand_stock, can_order_stock from stocklist where openid = ? and goods_code = ? order by id limit 1"
            params: ["${get_extract_data(token)}", "${get_extract_data(goods_code)}"]
            delta_from: stock_snapshot
            expect: {sorted_stock: 0, onhand_stock: 0, can_order_stock: 0}

    - case_name: 全量上架到Normal库位成功-状态4流转到状态5
      params:
        format: json
      db_before:
        stock_snapshot:
          sql: "select sorted_stock, onhand_stock, can_order_stock from stocklist where openid = ? and goods_code = ? order by id limit 1"
          params: ["${get_extract_data(token)}", "${get_extract_data(goods_code)}"]
        bin_snapshot:
          sql: "select count(*) as cnt from stockbin where openid = ? and bin_name = ? and goods_code = ?"
          params: ["${get_extract_data(token)}", "${get_extract_data(bin_name)}", "${get_extract_data(goods_code)}"]
      json:
        # 上架数量 = 实到数量（5），走 move_qty == 0 的全量上架分支
        asn_code: ${get_extract_data(asn_code)}
        goods_code: ${get_extract_data(goods_code)}
        bin_name: ${get_extract_data(bin_name)}
        qty: 5
      validation:
        - contains: {'status_code': 200}
        - eq: {'detail': 'success'}
        # 明细：状态 5、已上架数量 = 5
        - db:
            sql: "select asn_status, sorted_qty, goods_actual_qty from asndetail where asn_code = ? and is_delete = 0"
            params: ["${get_extract_data(asn_code)}"]
            expect: {asn_status: 5, sorted_qty: 5, goods_actual_qty: 5}
        # 主单：最后一条明细上架完成后整单也变成 5（入库完成）
        - db:
            sql: "select asn_status from asnlist where asn_code = ? and is_delete = 0"
            params: ["${get_extract_data(asn_code)}"]
            expect: {asn_status: 5}
        # 库存流转：已分拣量 -5，到货量 +5，Normal 库位使可用量 +5
        - db:
            sql: "select sorted_stock, onhand_stock, can_order_stock from stocklist where openid = ? and goods_code = ? order by id limit 1"
            params: ["${get_extract_data(token)}", "${get_extract_data(goods_code)}"]
            delta_from: stock_snapshot
            expect: {sorted_stock: -5, onhand_stock: 5, can_order_stock: 5}
        # 库位库存：该库位这条商品记录从无到有（增量 1 行）
        - db:
            sql: "select count(*) as cnt from stockbin where openid = ? and bin_name = ? and goods_code = ?"
            params: ["${get_extract_data(token)}", "${get_extract_data(bin_name)}", "${get_extract_data(goods_code)}"]
            delta_from: bin_snapshot
            expect: {cnt: 1}
