# ASN 预装车（状态 1 -> 2）
#
# 【业务位置】ASN 入库链路第 3 步：
#   创建主单(1) -> 添加明细 -> 【预装车(1->2)】 -> 预分拣(2->3) -> 完成分拣(3->4) -> 上架(4->5)
#   注意顺序：源码里 preload 校验的是 asn_status == 1，presort 校验 == 2，
#   所以「预装车」在「预分拣」之前，不是按中文名字的直觉顺序。
#   测试模块通过 CHAIN_ORDER = 30 声明执行顺序（见 conftest.py 的 pytest_collection_modifyitems）。
#
# 【前置依赖】需要 test_asn_create.py 提取的 asn_id / asn_code，以及 test_asn_detail.py 加好的明细
#   （源码里没有明细会报 "Please Enter The ASN Detail"）。
#
# 【接口行为（读源码 + 实测）】
#   POST /asn/preload/{asn_id}/  无请求体，成功返回主单对象（asn_status=2）
#   副作用：主单与明细 asn_status 1->2；stocklist asn_stock -= 数量、pre_load_stock += 数量

# 场景一：状态 1 -> 2 成功
- baseInfo:
    api_name: ASN预装车
    # 路径参数用 ${} 关联（base/apiutil.py 会对 url 做 replace_load）
    url: /asn/preload/${get_extract_data(asn_id)}/
    method: post
    header:
      Content-Type: application/json
      Accept: application/json
      token: ${get_extract_data(token)}
      operator: ${get_extract_data(operator)}

  testCase:
    - case_name: 预装车成功-状态1流转到状态2
      params:
        format: json
      db_before:
        stock_snapshot:
          sql: "select asn_stock, pre_load_stock, goods_qty, onhand_stock from stocklist where openid = ? and goods_code = ? order by id limit 1"
          params: ["${get_extract_data(token)}", "${get_extract_data(goods_code)}"]
      validation:
        - contains: {'status_code': 200}
        # 响应是主单对象，直接断言状态流转和主键
        - eq: {'asn_status': 2}
        # 主单与明细的状态都要变成 2
        - db:
            sql: "select asn_status from asnlist where asn_code = ? and is_delete = 0"
            params: ["${get_extract_data(asn_code)}"]
            expect: {asn_status: 2}
        - db:
            sql: "select asn_status from asndetail where asn_code = ? and is_delete = 0"
            params: ["${get_extract_data(asn_code)}"]
            rows: 1
            expect: {asn_status: 2}
        # 库存流转：ASN 在途量 -5，预装车量 +5，总数与到货量不动
        - db:
            sql: "select asn_stock, pre_load_stock, goods_qty, onhand_stock from stocklist where openid = ? and goods_code = ? order by id limit 1"
            params: ["${get_extract_data(token)}", "${get_extract_data(goods_code)}"]
            delta_from: stock_snapshot
            expect: {asn_stock: -5, pre_load_stock: 5, goods_qty: 0, onhand_stock: 0}

    - case_name: 预装车失败-重复预装车被幂等拦截
      params:
        format: json
      db_before:
        stock_snapshot:
          sql: "select asn_stock, pre_load_stock from stocklist where openid = ? and goods_code = ? order by id limit 1"
          params: ["${get_extract_data(token)}", "${get_extract_data(goods_code)}"]
      validation:
        # 上一条用例已经把状态推到 2，这里再点一次应该被拦截
        - contains: {'status_code': 200}
        - eq: {'status_code': 500}
        - contains: {'detail': 'This ASN Status Is Not 1'}
        # 状态与库存都不能再变
        - db:
            sql: "select asn_status from asnlist where asn_code = ? and is_delete = 0"
            params: ["${get_extract_data(asn_code)}"]
            expect: {asn_status: 2}
        - db:
            sql: "select asn_status from asndetail where asn_code = ? and is_delete = 0"
            params: ["${get_extract_data(asn_code)}"]
            expect: {asn_status: 2}
        - db:
            sql: "select asn_stock, pre_load_stock from stocklist where openid = ? and goods_code = ? order by id limit 1"
            params: ["${get_extract_data(token)}", "${get_extract_data(goods_code)}"]
            delta_from: stock_snapshot
            expect: {asn_stock: 0, pre_load_stock: 0}
