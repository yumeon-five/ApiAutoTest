# ASN 预分拣（状态 2 -> 3）
#
# 【业务位置】链路第 4 步：预装车(1->2) -> 【预分拣(2->3)】 -> 完成分拣(3->4) -> 上架(4->5)
# 【前置依赖】test_asn_preload.py 已把状态推到 2（CHAIN_ORDER = 40 保证跑在它后面）
#
# 【接口行为（读源码 + 实测）】
#   POST /asn/presort/{asn_id}/  无请求体，成功返回主单对象（asn_status=3）
#   副作用：主单与明细 asn_status 2->3；stocklist pre_load_stock -= 数量、pre_sort_stock += 数量

- baseInfo:
    api_name: ASN预分拣
    url: /asn/presort/${get_extract_data(asn_id)}/
    method: post
    header:
      Content-Type: application/json
      Accept: application/json
      token: ${get_extract_data(token)}
      operator: ${get_extract_data(operator)}

  testCase:
    - case_name: 预分拣成功-状态2流转到状态3
      params:
        format: json
      db_before:
        stock_snapshot:
          sql: "select pre_load_stock, pre_sort_stock, asn_stock from stocklist where openid = ? and goods_code = ? order by id limit 1"
          params: ["${get_extract_data(token)}", "${get_extract_data(goods_code)}"]
      validation:
        - contains: {'status_code': 200}
        - eq: {'asn_status': 3}
        - db:
            sql: "select asn_status from asnlist where asn_code = ? and is_delete = 0"
            params: ["${get_extract_data(asn_code)}"]
            expect: {asn_status: 3}
        - db:
            sql: "select asn_status from asndetail where asn_code = ? and is_delete = 0"
            params: ["${get_extract_data(asn_code)}"]
            rows: 1
            expect: {asn_status: 3}
        # 库存流转：预装车量 -5，预分拣量 +5，ASN 在途量保持不变
        - db:
            sql: "select pre_load_stock, pre_sort_stock, asn_stock from stocklist where openid = ? and goods_code = ? order by id limit 1"
            params: ["${get_extract_data(token)}", "${get_extract_data(goods_code)}"]
            delta_from: stock_snapshot
            expect: {pre_load_stock: -5, pre_sort_stock: 5, asn_stock: 0}

    - case_name: 预分拣失败-重复预分拣被幂等拦截
      params:
        format: json
      db_before:
        stock_snapshot:
          sql: "select pre_load_stock, pre_sort_stock from stocklist where openid = ? and goods_code = ? order by id limit 1"
          params: ["${get_extract_data(token)}", "${get_extract_data(goods_code)}"]
      validation:
        - contains: {'status_code': 200}
        - eq: {'status_code': 500}
        - contains: {'detail': 'This ASN Status Is Not 2'}
        - db:
            sql: "select asn_status from asnlist where asn_code = ? and is_delete = 0"
            params: ["${get_extract_data(asn_code)}"]
            expect: {asn_status: 3}
        - db:
            sql: "select pre_load_stock, pre_sort_stock from stocklist where openid = ? and goods_code = ? order by id limit 1"
            params: ["${get_extract_data(token)}", "${get_extract_data(goods_code)}"]
            delta_from: stock_snapshot
            expect: {pre_load_stock: 0, pre_sort_stock: 0}
