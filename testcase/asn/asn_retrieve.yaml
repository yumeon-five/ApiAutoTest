# 按 ID 查询 ASN 主单（链路收尾校验）
#
# 【核对什么】用创建时提取的 asn_id 反查主单，确认接口返回的 id / asn_code / bar_code
#   与创建接口一致 —— 这是「接口之间的自洽性」校验（创建时返回的单号，查回来还得是同一个）

- baseInfo:
    api_name: 按ID查询ASN主单
    url: /asn/list/${get_extract_data(asn_id)}/
    method: get
    header:
      Accept: application/json
      token: ${get_extract_data(token)}
      operator: ${get_extract_data(operator)}

  testCase:
    - case_name: 按ID查询ASN主单详情
      params:
        format: json
      validation:
        - contains: {'status_code': 200}
        # 查回来的主键、单号、条码必须和创建时提取的一致
        - eq: {'id': '${get_extract_data(asn_id)}', 'asn_code': '${get_extract_data(asn_code)}'}
        - contains: {'bar_code': '${get_extract_data(bar_code)}'}
        # 链路跑完，主单状态应该是 5（入库完成）
        - eq: {'asn_status': 5}
        - not_null: ['$.creater', '$.create_time']
        # 接口与数据库一致性：接口返回的状态、单号、条码要和库里一致
        - db:
            sql: "select asn_code, bar_code, asn_status from asnlist where id = ? and is_delete = 0"
            params: ["${get_extract_data(asn_id)}"]
            expect:
              asn_code: "${get_extract_data(asn_code)}"
              bar_code: "${get_extract_data(bar_code)}"
              asn_status: 5
