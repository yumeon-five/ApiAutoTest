# ASN 完成分拣（状态 3 -> 4）
#
# 【业务位置】链路第 5 步：预分拣(2->3) -> 【完成分拣(3->4)】 -> 上架(4->5)
# 【前置依赖】test_asn_presort.py 已把状态推到 3（CHAIN_ORDER = 50）
#
# 【接口行为（读源码 + 实测）】
#   POST /asn/sorted/{asn_id}/  请求体需要 asn_code、supplier、goodsData[{goods_code, goods_actual_qty}]
#   - goods_actual_qty 与计划数量比较：
#       实到 == 计划 -> 无差异；实到 < 计划 -> 记短缺；实到 > 计划 -> 记多到
#       实到 == 0 -> 全部短缺，明细直接置为 5（不用再上架），goods_qty 扣减
#   - 本用例走「实到 == 计划 = 5」，所以明细 asn_status 3->4、主单 3->4
#   - 成功返回 {"detail": "success"}
#   副作用：stocklist pre_sort_stock -= 计划数量（源码写的都是 asn_detail.goods_qty），
#          sorted_stock += 实到数量

- baseInfo:
    api_name: ASN完成分拣
    url: /asn/sorted/${get_extract_data(asn_id)}/
    method: post
    header:
      Content-Type: application/json
      Accept: application/json
      token: ${get_extract_data(token)}
      operator: ${get_extract_data(operator)}

  testCase:
    - case_name: 完成分拣成功-实到数量等于计划数量状态3流转到状态4
      params:
        format: json
      db_before:
        stock_snapshot:
          sql: "select pre_sort_stock, sorted_stock, asn_stock, goods_qty from stocklist where openid = ? and goods_code = ? order by id limit 1"
          params: ["${get_extract_data(token)}", "${get_extract_data(goods_code)}"]
      json:
        asn_code: ${get_extract_data(asn_code)}
        supplier: ${get_extract_data(supplier_name)}
        goodsData: [{"goods_code": "${get_extract_data(goods_code)}", "goods_actual_qty": 5}]
      validation:
        - contains: {'status_code': 200}
        - eq: {'detail': 'success'}
        - db:
            sql: "select asn_status from asnlist where asn_code = ? and is_delete = 0"
            params: ["${get_extract_data(asn_code)}"]
            expect: {asn_status: 4}
        # 明细状态 4，并且记录了实到数量
        - db:
            sql: "select asn_status, goods_qty, goods_actual_qty, goods_shortage_qty, goods_more_qty from asndetail where asn_code = ? and is_delete = 0"
            params: ["${get_extract_data(asn_code)}"]
            expect: {asn_status: 4, goods_qty: 5, goods_actual_qty: 5, goods_shortage_qty: 0, goods_more_qty: 0}
        # 库存流转：预分拣量清空（-5），已分拣量 +5，在途量与总数不动
        - db:
            sql: "select pre_sort_stock, sorted_stock, asn_stock, goods_qty from stocklist where openid = ? and goods_code = ? order by id limit 1"
            params: ["${get_extract_data(token)}", "${get_extract_data(goods_code)}"]
            delta_from: stock_snapshot
            expect: {pre_sort_stock: -5, sorted_stock: 5, asn_stock: 0, goods_qty: 0}

    - case_name: 完成分拣失败-重复提交分拣结果被幂等拦截
      params:
        format: json
      db_before:
        detail_snapshot:
          sql: "select goods_actual_qty from asndetail where asn_code = ? and is_delete = 0"
          params: ["${get_extract_data(asn_code)}"]
        stock_snapshot:
          sql: "select sorted_stock, pre_sort_stock from stocklist where openid = ? and goods_code = ? order by id limit 1"
          params: ["${get_extract_data(token)}", "${get_extract_data(goods_code)}"]
      json:
        asn_code: ${get_extract_data(asn_code)}
        supplier: ${get_extract_data(supplier_name)}
        goodsData: [{"goods_code": "${get_extract_data(goods_code)}", "goods_actual_qty": 5}]
      validation:
        # 状态已经是 4，再次提交应该被拦截
        - contains: {'status_code': 200}
        - eq: {'status_code': 500}
        - contains: {'detail': 'This ASN Status Is Not 3'}
        - db:
            sql: "select asn_status from asnlist where asn_code = ? and is_delete = 0"
            params: ["${get_extract_data(asn_code)}"]
            expect: {asn_status: 4}
        # 实到数量不得再次累加
        - db:
            sql: "select goods_actual_qty from asndetail where asn_code = ? and is_delete = 0"
            params: ["${get_extract_data(asn_code)}"]
            delta_from: detail_snapshot
            expect: {goods_actual_qty: 0}
        - db:
            sql: "select sorted_stock, pre_sort_stock from stocklist where openid = ? and goods_code = ? order by id limit 1"
            params: ["${get_extract_data(token)}", "${get_extract_data(goods_code)}"]
            delta_from: stock_snapshot
            expect: {sorted_stock: 0, pre_sort_stock: 0}
