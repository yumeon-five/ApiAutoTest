# 查询商品总库存 —— 入库前基线（链路数据准备第 4 步）
#
# 【为什么需要】链路结束后要断言「库存净增 = 上架数量、中间态全部归零」，
#   这必须先有一条基线。用例文档也是这么要求的：
#   「保存 goods_qty、onhand_stock、can_order_stock、asn_stock、pre_load_stock、
#     pre_sort_stock、sorted_stock 等字段作为后续增量断言基线；当 count=0 时对应基线按 0 处理」。
#
# 【基线怎么存】用 db_before 在请求前查库快照，写进 extract.yaml（名字叫 stock_baseline）。
#   为什么不从接口响应里 extract？因为商品在库里可能压根没有库存记录（count=0），
#   这时接口没有值可提取；而 db_before 查不到会写 None，断言层会把 None 当 0 处理，
#   两种情况都能覆盖（这是用例文档明确要求的语义）。

- baseInfo:
    api_name: 查询商品总库存-入库前基线
    url: /stock/list/
    method: get
    header:
      Accept: application/json
      token: ${get_extract_data(token)}
      operator: ${get_extract_data(operator)}

  testCase:
    - case_name: 入库前查询商品总库存作为基线
      params:
        goods_code: ${get_extract_data(goods_code)}
        page: 1
        max_page: 20
        format: json
      db_before:
        stock_baseline:
          sql: "select goods_qty, onhand_stock, can_order_stock, asn_stock, pre_load_stock, pre_sort_stock, sorted_stock from stocklist where openid = ? and goods_code = ? order by id limit 1"
          params: ["${get_extract_data(token)}", "${get_extract_data(goods_code)}"]
        # 库位库存的基线也必须在这里打。库位库存查询用例自己的 db_before 是在上架「之后」执行的，
        # 那时增量已经发生，拿它当基线只能算出「增量为 0」——这个坑我踩过一次，写在这里备查
        bin_stock_baseline:
          sql: "select coalesce(sum(goods_qty), 0) as qty, count(*) as cnt from stockbin where openid = ? and bin_name = ? and goods_code = ?"
          params: ["${get_extract_data(token)}", "${get_extract_data(bin_name)}", "${get_extract_data(goods_code)}"]
      validation:
        - contains: {'status_code': 200}
        # results 必须是数组（count=0 时就是空数组，这是允许的：商品还没建过库存记录）
        - not_null: ['$.results']
        - db:
            sql: "select (count(*) - ?) as diff from stocklist where openid = ? and goods_code = ?"
            params: ["${get_extract_data(stock_total)}", "${get_extract_data(token)}", "${get_extract_data(goods_code)}"]
            expect: {diff: 0}
      extract:
        stock_total: $.count
