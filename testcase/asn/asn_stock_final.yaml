# 查询商品总库存 —— 上架后核对增量（链路的收尾校验）
#
# 【这是整条链路最有价值的一条断言】它验证的是「跨步骤的库存不变量」，单个步骤的断言查不出来：
#   - 终态：goods_qty、onhand_stock、can_order_stock 都比入库前基线净增上架数量
#   - 中间态：asn_stock、pre_load_stock、pre_sort_stock、sorted_stock 全部回到基线（增量 0）
#     这一步能抓到「某一步的库存扣减没做干净 / 重复扣减」这类跨步骤问题
#   - 接口与数据库一致：接口返回的字段值要和 stocklist 表里的实际记录一致
#
# 依赖 testcase/asn/asn_stock_baseline.yaml（CHAIN_ORDER=5）写入的 stock_baseline 基线

- baseInfo:
    api_name: 查询商品总库存-上架后核对
    url: /stock/list/
    method: get
    header:
      Accept: application/json
      token: ${get_extract_data(token)}
      operator: ${get_extract_data(operator)}

  testCase:
    - case_name: 上架完成后核对商品总库存增量与中间态归零
      params:
        goods_code: ${get_extract_data(goods_code)}
        page: 1
        max_page: 20
        format: json
      extract:
        # 接口返回的终态数值，下面拿去和数据库比对（接口与库一致性校验）
        stock_final_goods_qty: $.results[0].goods_qty
        stock_final_onhand: $.results[0].onhand_stock
        stock_final_can_order: $.results[0].can_order_stock
      validation:
        - contains: {'status_code': 200}
        # 链路走完后这个商品一定有库存记录了
        - eq: {'count': 1}
        - contains: {'goods_code': '${get_extract_data(goods_code)}'}
        # 终态净增：商品总量 / 到货量 / 可用量都 +5（计划=实到=上架=5）
        - db:
            sql: "select goods_qty, onhand_stock, can_order_stock from stocklist where openid = ? and goods_code = ? order by id limit 1"
            params: ["${get_extract_data(token)}", "${get_extract_data(goods_code)}"]
            delta_from: stock_baseline
            expect: {goods_qty: 5, onhand_stock: 5, can_order_stock: 5}
        # 中间态归零：这几个字段走完全流程后必须回到基线，否则说明库存流转有残留
        - db:
            sql: "select asn_stock, pre_load_stock, pre_sort_stock, sorted_stock from stocklist where openid = ? and goods_code = ? order by id limit 1"
            params: ["${get_extract_data(token)}", "${get_extract_data(goods_code)}"]
            delta_from: stock_baseline
            expect: {asn_stock: 0, pre_load_stock: 0, pre_sort_stock: 0, sorted_stock: 0}
        # 接口与数据库一致性：接口返回的三个数值要和库里一模一样（差值 0）
        - db:
            sql: "select (goods_qty - ?) as g, (onhand_stock - ?) as o, (can_order_stock - ?) as c from stocklist where openid = ? and goods_code = ? order by id limit 1"
            params:
              - "${get_extract_data(stock_final_goods_qty)}"
              - "${get_extract_data(stock_final_onhand)}"
              - "${get_extract_data(stock_final_can_order)}"
              - "${get_extract_data(token)}"
              - "${get_extract_data(goods_code)}"
            expect: {g: 0, o: 0, c: 0}
