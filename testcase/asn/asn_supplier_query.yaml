# 查询可用供应商（链路数据准备第 1 步）
#
# 【为什么需要】链路后续接口都要传「供应商名称」，这是数据不是常量：换环境、重置库之后名字会变。
#   所以先查出来、提取到 extract.yaml，后面用 ${get_extract_data(supplier_name)} 关联。
#
# 【接口行为（实测）】GET /supplier/  返回 DRF 分页结构，results[0] 含 supplier_name / supplier_city

- baseInfo:
    api_name: 查询可用供应商
    url: /supplier/
    method: get
    header:
      Accept: application/json
      token: ${get_extract_data(token)}
      operator: ${get_extract_data(operator)}

  testCase:
    - case_name: 查询可用供应商成功并提取供应商名称
      params:
        page: 1
        max_page: 20
        format: json
      extract:
        # 接口关联：取第一个可用供应商，供创建主单 / 添加明细 / 完成分拣使用
        supplier_name: $.results[0].supplier_name
        # 接口返回的条数，下面拿去和数据库比对
        supplier_total: $.count
      validation:
        - contains: {'status_code': 200}
        # 至少要有可用供应商，否则链路没法继续
        - gt: {'$.count': 0}
        - not_null: ['$.results']
        # 接口与数据库一致性校验：接口返回的条数要等于库里该账号未删除的供应商条数
        # （断言在 extract 之后才解析 ${}，所以这里能用上面刚提取的 supplier_total）
        - db:
            sql: "select (count(*) - ?) as diff from supplier where openid = ? and is_delete = 0"
            params: ["${get_extract_data(supplier_total)}", "${get_extract_data(token)}"]
            expect: {diff: 0}
