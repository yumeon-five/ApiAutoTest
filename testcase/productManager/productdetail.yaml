- baseInfo:
    api_name: 获取商品详情
    url: /coupApply/cms/productDetail
    method: post
    header:
      Content-Type: application/json;charset=UTF-8
      token: ${get_extract_data(token,0)}
  testCase:
    - case_name: 获取商品详情
      json:
        pro_id: ${get_extract_data_list(goodsId)}
        page: 1
        size: 20
      validation:
        - contains: { 'error_code': '4000' }
